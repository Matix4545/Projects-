# ChambaRadar: descarga las vacantes de todas las empresas y las guarda en Supabase.
# Corre solo todos los días; también a mano: Actions → "ChambaRadar · Recolectar vacantes" → "Run workflow".
#
# Usa su PROPIO proyecto de Supabase (no el de Reporta Cajeme). Necesita dos secretos
# en GitHub (Settings → Secrets and variables → Actions):
#   CHAMBARADAR_SUPABASE_URL y CHAMBARADAR_SUPABASE_SERVICE_ROLE_KEY
name: ChambaRadar · Recolectar vacantes

on:
  schedule:
    # 11:17 UTC = 5:17 a. m. en Ciudad de México
    - cron: "17 11 * * *"
  workflow_dispatch:
    inputs:
      empresa:
        description: "Opcional: solo una empresa (su slug de data/empresas.json, p. ej. kavak)"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: chambaradar-recolectar
  cancel-in-progress: false

jobs:
  recolectar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: chambaradar
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: chambaradar/package-lock.json
      - run: npm ci
      - run: npm test
      - name: Recolectar vacantes
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.CHAMBARADAR_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.CHAMBARADAR_SUPABASE_SERVICE_ROLE_KEY }}
          EMPRESA: ${{ inputs.empresa }}
        run: |
          if [ -z "$NEXT_PUBLIC_SUPABASE_URL" ] || [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "::error::Faltan los secretos CHAMBARADAR_SUPABASE_URL y CHAMBARADAR_SUPABASE_SERVICE_ROLE_KEY"
            exit 1
          fi
          node scripts/recolectar.ts $EMPRESA
